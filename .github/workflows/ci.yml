name: Проверка и релиз

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run import_lint
      - run: flutter analyze
      - run: flutter test
      - name: Подпись тестового APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.FINNI_ANDROID_KEYSTORE }}
        run: |
          test -n "$SIGNING_KEY"
          install -d -m 700 "$HOME/.android"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Проверка разрешений APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          test -n "$AAPT"
          "$AAPT" dump permissions "$APK"
          if "$AAPT" dump permissions "$APK" | grep -q 'uses-permission'; then
            echo 'В APK обнаружены разрешения Android'
            exit 1
          fi
      - name: Тестовый стенд
        run: flutter build web --release --no-wasm-dry-run --target lib/main_stand.dart --dart-define=BUILD_ID=${{ github.run_number }}-${{ github.sha }}
      - name: Подготовка релиза
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p build/web/downloads release
          cp build/app/outputs/flutter-apk/app-release.apk build/web/downloads/finni.apk
          cp build/app/outputs/flutter-apk/app-release.apk release/finni.apk
          python3 -c 'import json,os; json.dump({"build":os.environ["BUILD_NUMBER"],"commit":os.environ["COMMIT_SHA"]},open("build/web/version.json","w"))'
          tar -czf release/stand.tar.gz -C build/web .
          cd release
          sha256sum finni.apk stand.tar.gz > SHA256SUMS
      - name: Ключ деплоя
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          DEPLOY_KEY: ${{ secrets.FINNI_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.FINNI_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/finni"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/finni" "$HOME/.ssh/known_hosts"
      - name: Релиз и деплой
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ secrets.FINNI_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.FINNI_DEPLOY_PORT }}
          BUILD_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: bash deploy/publish.sh
