name: finni
description: "Питомец Финни — офлайн-приложение по финансовой грамотности для детей 7-11 лет."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  import_lint: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/images/
    - assets/images/hud/
    - assets/pets/moni/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
